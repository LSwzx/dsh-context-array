- insert:
    - id: context-array
      name: dsh-context-array
      config:
        dataDir: ''          # empty = <home>/.dsh/context-array
        spaceId: space-default
        spaceName: Default space
        spaceRules: 'Shared workspace facts stay in this space unless a more specific space is bound.'
        observeUsage: true
        bootstrapMessages: true
        # off | observe | fold. `fold` takes over compaction and really folds at the
        # ratio below (see design doc §6/§7); `observe` only samples and alarms.
        compactionMode: fold
        compactionWarnTokens: 300000
        compactionAlarmRatio: 0.7
        compactionFoldRatio: 0.85      # fold when pressure reaches 85% of the window
        compactionRetainRatio: 0.3     # keep at least 30% of surface tokens
        compactionMinFoldTokens: 8000  # never fold a smaller region
        compactionSummaryMaxTokens: 600
        enableEmbedding: true
        # M3: central memory manager identities (deployment config, never model-set).
        # Leave this empty on a fresh install: the host offers a one-time "设为记忆管理员"
        # action in the space panel (POST /admin/claim), which writes a role='admin'
        # binding for one existing session. Fill explicit ids only to pin an admin for a
        # whole deployment (they must exist in this profile).
        adminSessionIds: []
        queueStaleMinutes: 10
        queueMaxRetries: 3
        wakeMaxPerHour: 10   # M4 inbox wake rate limit per target session
        # Update check / auto-update (registry installs only; a path install is skipped).
        updateCheck: true
        updatePolicy: auto   # off | notify | auto
        updateCheckIntervalHours: 6
